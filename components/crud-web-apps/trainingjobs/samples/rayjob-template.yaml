# RayJob Template
# This is an example of the RayJob CRD that gets created when you submit a training job

apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: xgboost-iris-training
  namespace: kubeflow-user-example-com
  labels:
    app: xgboost-iris-training
    training-job-id: xgboost-iris-training-a1b2c3d4
    algorithm: xgboost
  annotations:
    training-job-id: xgboost-iris-training-a1b2c3d4
spec:
  entrypoint: python /home/ray/xgboost_train_version_2.py
  runtimeEnvYAML: |
    env_vars:
      TRAINING_CONFIG: |
        {
          "input": [
            {
              "channelName": "train",
              "channelType": "train",
              "sourceType": "object-storage",
              "storageProvider": "minio",
              "endpoint": "http://minio.minio-system.svc.cluster.local:9000",
              "bucket": "kubeflow-user-example-com",
              "path": "training-data/train/iris-train.csv",
              "featureNames": ["sepal_length", "sepal_width", "petal_length", "petal_width"],
              "labelName": "target"
            },
            {
              "channelName": "validation",
              "channelType": "validation",
              "sourceType": "object-storage",
              "storageProvider": "minio",
              "endpoint": "http://minio.minio-system.svc.cluster.local:9000",
              "bucket": "kubeflow-user-example-com",
              "path": "training-data/validation/iris-val.csv",
              "featureNames": ["sepal_length", "sepal_width", "petal_length", "petal_width"],
              "labelName": "target"
            }
          ],
          "output": {
            "storageProvider": "minio",
            "bucket": "kubeflow-user-example-com",
            "path": "output/xgboost-iris-training",
            "endpoint": "http://minio.minio-system.svc.cluster.local:9000"
          },
          "checkpoint": {
            "storageProvider": "minio",
            "bucket": "kubeflow-user-example-com",
            "path": "checkpoint/xgboost-iris-training",
            "endpoint": "http://minio.minio-system.svc.cluster.local:9000"
          },
          "currentNamespace": "kubeflow-user-example-com",
          "xgboost": {
            "num_boost_round": 100,
            "early_stopping_rounds": 10,
            "csv_weight": 1,
            "booster": "gbtree",
            "verbosity": 1,
            "nthread": "4",
            "eta": 0.3,
            "gamma": 0,
            "max_depth": 6,
            "min_child_weight": 1,
            "max_delta_step": 0,
            "subsample": 1,
            "sampling_method": "uniform",
            "colsample_bytree": 1,
            "colsample_bylevel": 1,
            "colsample_bynode": 1,
            "lambda": 1,
            "alpha": 0,
            "tree_method": "auto",
            "sketch_eps": 0.03,
            "scale_pos_weight": 1,
            "updater": "grow_colmaker,prune",
            "dsplit": "auto",
            "refresh_leaf": 1,
            "process_type": "default",
            "grow_policy": "depthwise",
            "max_leaves": 0,
            "max_bin": 256,
            "num_parallel_tree": 1,
            "sample_type": "uniform",
            "normalize_type": "tree",
            "rate_drop": 0,
            "one_drop": 0,
            "skip_drop": 0,
            "lambda_bias": 0,
            "tweedie_variance_power": 1.5,
            "objective": "multi:softmax",
            "base_score": 0.5,
            "eval_metric": ["mlogloss", "merror"]
          }
        }
  rayClusterSpec:
    rayVersion: "2.46.0"
    headGroupSpec:
      rayStartParams: {}
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          containers:
            - name: ray-head
              image: kiepdoden123/iris-training-ray:latest
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                limits:
                  cpu: "4"
                  memory: "16Gi"
                requests:
                  cpu: "4"
                  memory: "16Gi"
              volumeMounts:
                - mountPath: /home/ray/result-storage
                  name: result-storage
          volumes:
            - name: result-storage
              persistentVolumeClaim:
                claimName: kham-pv-for-xgboost
    workerGroupSpecs:
      - replicas: 2
        minReplicas: 1
        maxReplicas: 10
        groupName: small-group
        rayStartParams: {}
        template:
          metadata:
            annotations:
              sidecar.istio.io/inject: "false"
          spec:
            containers:
              - name: ray-worker
                image: kiepdoden123/iris-training-ray:latest
                resources:
                  limits:
                    cpu: "4"
                    memory: "16Gi"
                  requests:
                    cpu: "4"
                    memory: "16Gi"
                volumeMounts:
                  - mountPath: /home/ray/result-storage
                    name: result-storage
            volumes:
              - name: result-storage
                persistentVolumeClaim:
                  claimName: kham-pv-for-xgboost

---
# Tensorboard CRD (auto-created with each training job)

apiVersion: tensorboard.kubeflow.org/v1alpha1
kind: Tensorboard
metadata:
  name: xgboost-iris-training-tb
  namespace: kubeflow-user-example-com
  labels:
    tensorboards: "true"
  annotations:
    s3-endpoint: http://minio.minio-system.svc.cluster.local:9000
spec:
  logspath: s3://kubeflow-user-example-com/output/xgboost-iris-training
